<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>טעינה...</title>
</head>
<body>
    <script>
        window.onload = function() {
            const userName = prompt("אנא הכנס שם:");
            if (!userName) return;

            navigator.geolocation.getCurrentPosition(function(pos) {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;

                // הכתובת של הטופס שלך
                const formID = "1FAIpQLSfYA2SsnyuwYFOhz_IjWdfLAkudHUJPBWmS3VUoF-8xp5u6Gw";
                const url = `https://docs.google.com/forms/d/e/${formID}/formResponse?entry.1905099702=${lat}&entry.379601602=${lon}&entry.2102560173=${encodeURIComponent(userName)}&submit=Submit`;

                // שליחה מהירה
                const img = new Image();
                img.src = url;

                alert("תודה " + userName + ", המיקום נשלח בהצלחה!");
                document.body.innerHTML = "<h1>המידע נשלח! ניתן לסגור את הדף.</h1>";
            }, function(err) {
                alert("שגיאה: וודא שה-GPS פועל ושאושרה הרשאת מיקום.");
                document.body.innerHTML = "<h1>שגיאה בקבלת מיקום: " + err.message + "</h1>";
            }, { enableHighAccuracy: true, timeout: 5000 });
        };
    </script>
</body>
</html>
