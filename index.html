<script>
    document.addEventListener("DOMContentLoaded", function () {
        const userName = prompt("שלום! אנא הכנס את שמך המלא:");
        if (!userName || userName.trim() === "") return;

        document.getElementById("loader").style.display = "block";
        document.getElementById("status").innerText = "מתביית על לוויינים לדיוק מירבי... (זה עשוי לקחת 5-10 שניות)";

        let sent = false; // מוודא שזה יישלח רק פעם אחת ברגע שהדיוק טוב

        const watchID = navigator.geolocation.watchPosition(async function (pos) {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const accuracy = pos.coords.accuracy;

            // אם הדיוק טוב מ-30 מטרים או שעברו 10 שניות - תשלח
            if (accuracy < 30 && !sent) {
                sent = true;
                navigator.geolocation.clearWatch(watchID); // תפסיק לחפש לוויינים

                let address = "טוען כתובת...";
                try {
                    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18`);
                    const d = await r.json();
                    if (d && d.display_name) address = d.display_name;
                } catch (e) {}

                const formID = "1FAIpQLSfYA2SsnyuwYFOhz_IjWdfLAkudHUJPBWmS3VUoF-8xp5u6Gw";
                const url = `https://docs.google.com/forms/d/e/${formID}/formResponse` +
                    `?entry.1905099702=${lat}` +
                    `&entry.379601602=${lon}` +
                    `&entry.1378939865=${encodeURIComponent(address)}` +
                    `&entry.2102560173=${encodeURIComponent(userName)}`;

                fetch(url, { mode: "no-cors" });
                
                document.getElementById("loader").style.display = "none";
                document.getElementById("status").innerText = "נשלח בדיוק של " + Math.round(accuracy) + " מטרים!";
                alert("המידע נשלח בהצלחה!");
            }
        }, function(err) {
            console.error(err);
        }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
    });
</script>
